# TEST FIXTURE ONLY. Not a real ATT&CK technique and not an Atomic Red Team
# test. Used by tests/Invoke-SmokeTest.ps1 with the mock Invoke-AtomicTest in
# ../../invoke-atomicredteam. Every command only echoes text or writes/removes
# marker files in the folder given by marker_dir.
attack_technique: T9999.001
display_name: 'TTX Fixture Technique'
atomic_tests:
- name: Write marker file
  auto_generated_guid: 11111111-1111-4111-8111-111111111111
  description: |
    Fixture test. Writes a marker file into marker_dir. Needs a local prereq
    file first.
  supported_platforms:
  - windows
  input_arguments:
    marker_dir:
      description: Folder for the fixture marker files
      type: path
      default: $env:TEMP\TTX-Fixture
    marker_name:
      description: Marker file name
      type: string
      default: marker.txt
  dependency_executor_name: powershell
  dependencies:
  - description: |
      Fixture prereq file must exist in #{marker_dir}
    prereq_command: |
      if (Test-Path -LiteralPath (Join-Path "#{marker_dir}" 'prereq.txt')) { exit 0 } else { exit 1 }
    get_prereq_command: |
      # Fixture: a real prereq might fetch https://example.invalid/tool.zip; this one only writes a local file.
      New-Item -ItemType Directory -Force -Path "#{marker_dir}" | Out-Null
      Set-Content -LiteralPath (Join-Path "#{marker_dir}" 'prereq.txt') -Value 'TTX fixture prereq'
  executor:
    name: powershell
    elevation_required: false
    command: |
      New-Item -ItemType Directory -Force -Path "#{marker_dir}" | Out-Null
      Set-Content -LiteralPath (Join-Path "#{marker_dir}" "#{marker_name}") -Value 'TTX fixture marker'
      Write-Output "marker written: #{marker_name}"
    cleanup_command: |
      Remove-Item -LiteralPath (Join-Path "#{marker_dir}" "#{marker_name}") -Force -ErrorAction Ignore
- name: Echo only
  auto_generated_guid: 22222222-2222-4222-8222-222222222222
  description: |
    Fixture test. Echoes a message and changes nothing.
  supported_platforms:
  - windows
  input_arguments:
    message:
      description: Text to echo
      type: string
      default: hello from the fixture
  executor:
    name: powershell
    elevation_required: false
    command: |
      Write-Output "TTX fixture echo: #{message}"
    cleanup_command: |
      Write-Output "TTX fixture echo cleanup: nothing to remove"
- name: Needs elevation
  auto_generated_guid: 33333333-3333-4333-8333-333333333333
  description: |
    Fixture test. Echoes text but declares elevation_required, to exercise the
    elevation guardrail.
  supported_platforms:
  - windows
  executor:
    name: powershell
    elevation_required: true
    command: |
      Write-Output "TTX fixture elevated echo"
- name: Linux only
  auto_generated_guid: 44444444-4444-4444-8444-444444444444
  description: |
    Fixture test for another platform; the catalog must filter it out.
  supported_platforms:
  - linux
  executor:
    name: sh
    command: |
      echo "TTX fixture linux echo"
- name: Fails on purpose
  auto_generated_guid: 55555555-5555-4555-8555-555555555555
  description: |
    Fixture test. Echoes text and exits with code 3.
  supported_platforms:
  - windows
  executor:
    name: powershell
    elevation_required: false
    command: |
      Write-Output "TTX fixture failure"
      exit 3
